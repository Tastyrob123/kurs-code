<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2600 1180" width="2600" height="1180" fill="none">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2b"/>
      <stop offset="1" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d3a"/>
      <stop offset="1" stop-color="#14161f"/>
