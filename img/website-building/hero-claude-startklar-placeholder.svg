    <rect x="664" y="310" width="560" height="150" rx="18" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="716" cy="385" r="16" fill="#c7b489" fill-opacity="0.75"/>
    <rect x="754" y="368" width="240" height="16" rx="8" fill="#ffffff" fill-opacity="0.26"/>
    <rect x="754" y="400" width="360" height="12" rx="6" fill="#ffffff" fill-opacity="0.14"/>

    <rect x="664" y="490" width="560" height="150" rx="18" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
