    <path d="M0 40 Q0 8 32 8 L150 8 L186 52 L360 52 Q392 52 392 84 L392 380 Q392 412 360 412 L32 412 Q0 412 0 380 Z" fill="url(#deck)" stroke="#c7b489" stroke-opacity="0.24" stroke-width="2.5"/>
