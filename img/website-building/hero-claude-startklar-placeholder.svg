    <rect x="56" y="310" width="560" height="330" rx="18" fill="#ffffff" fill-opacity="0.035" stroke="#c7b489" stroke-opacity="0.26" stroke-width="2"/>
    <rect x="92" y="352" width="230" height="18" rx="9" fill="#c7b489" fill-opacity="0.80"/>
    <rect x="92" y="404" width="430" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="92" y="440" width="380" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="92" y="476" width="410" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="92" y="512" width="300" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.14"/>
