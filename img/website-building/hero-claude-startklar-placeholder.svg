    <rect x="0" y="40" width="1280" height="26" fill="#20232f"/>
    <circle cx="42" cy="33" r="9" fill="#c7b489" fill-opacity="0.55"/>
    <circle cx="76" cy="33" r="9" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="110" cy="33" r="9" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="560" y="26" width="160" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>

    <!-- Prompt-Zeilen -->
    <rect x="56" y="130" width="26" height="16" rx="4" fill="#c7b489" fill-opacity="0.85"/>
    <rect x="100" y="130" width="420" height="16" rx="8" fill="#ffffff" fill-opacity="0.30"/>
    <rect x="56" y="186" width="26" height="16" rx="4" fill="#c7b489" fill-opacity="0.55"/>
